name: Test

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - run: sh -n tmmx.tmux bin/tmmx scripts/*.sh tests/test-common.sh tests/test-bindings.sh tests/test-reconnect.sh
      - run: sh tests/test-common.sh
      - run: sh tests/test-bindings.sh
      - run: sh tests/test-reconnect.sh
