set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g status-interval 5
set -g base-index 1
set -g pane-base-index 1

# minova theme (cloned into /opt/minova by the Dockerfile): show session + host.
set -g @minova-segment-mode-fg "#ff6526"
set -g @minova-segment-hostname "@#h"
set -g @minova-segment-hostname-fg "#ff55ff"
set -g @minova-segment-session-fg "#50fa7b"
set -g @minova-segments-left "session"
set -g @minova-segments-right "hostname"
set -g @minova-fg "#7f7f7f"
set -g @minova-fg-current "#ffffff"
set -g @minova-hline "true"
set -g @minova-hline-fg "#222222"
set -g @minova-pane-border-fg "#222222"
set -g @minova-pane-active-border-fg "#999999"
run-shell /opt/minova/minova.tmux

# tmmx on the host too (repo mounted at /opt/tmmx) — the full remote experience:
# C-\ e opens this host's own session picker, forwarded through the wrapper.
set -g @tmmx_picker_key 'e'
set -g @tmmx_popup_width '40%'
set -g @tmmx_popup_height '55%'
run-shell /opt/tmmx/tmmx.tmux
