# Four demo hosts, each the same image with a different DEMO_ROLE, published on a
# distinct localhost port so your real terminal can ssh to them by name (see up.sh,
# which writes the matching ~/.ssh config). Key is generated by up.sh.
services:
  web:
    build: { context: ./host }
    hostname: web
    environment: { DEMO_ROLE: web }
    ports: ["2201:22"]
    volumes:
      - ${TMMX_DEMO_KEYS_DIR}:/keys:ro
      - ../:/opt/tmmx:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22"]
      interval: 1s
      timeout: 1s
      retries: 20

  api:
    build: { context: ./host }
    hostname: api
    environment: { DEMO_ROLE: api }
    ports: ["2202:22"]
    volumes:
      - ${TMMX_DEMO_KEYS_DIR}:/keys:ro
      - ../:/opt/tmmx:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22"]
      interval: 1s
      timeout: 1s
      retries: 20

  db:
    build: { context: ./host }
    hostname: db
    environment: { DEMO_ROLE: db }
    ports: ["2203:22"]
    volumes:
      - ${TMMX_DEMO_KEYS_DIR}:/keys:ro
      - ../:/opt/tmmx:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22"]
      interval: 1s
      timeout: 1s
      retries: 20

  worker:
    build: { context: ./host }
    hostname: worker
    environment: { DEMO_ROLE: worker }
    ports: ["2204:22"]
    volumes:
      - ${TMMX_DEMO_KEYS_DIR}:/keys:ro
      - ../:/opt/tmmx:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22"]
      interval: 1s
      timeout: 1s
      retries: 20
